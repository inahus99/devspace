<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb3ad"/>
      <stop offset="0.7" stop-color="#9fd2cb"/>
      <stop offset="1" stop-color="#d9ece6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa7a1"/>
      <stop offset="1" stop-color="#7cc8c0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7d4"/>
      <stop offset="1" stop-color="#ead9bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1130" cy="150" r="120" fill="url(#glow)"/>
  <circle cx="1130" cy="150" r="46" fill="#fbe9d0"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.92">
    <path d="M1240 268c0-26 22-46 48-44 10-22 34-36 58-30 14-24 48-30 70-12 26-6 52 12 54 40 24 2 40 20 40 46z"/>
    <path d="M1390 280c0-18 16-32 34-30 8-16 26-24 44-18 16-8 36 2 40 20 18 2 30 14 30 28z" opacity="0.8"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <path d="M560 120c0-14 12-24 26-22 6-14 22-20 36-14 10-10 30-8 36 6 14 0 26 12 24 30z"/>
    <path d="M380 210c0-10 9-18 19-16 5-10 16-14 26-10 7-7 21-5 25 4 10 0 18 9 17 22z" opacity="0.8"/>
  </g>

  <!-- Sea -->
  <rect y="280" width="1600" height="62" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.55" stroke-width="2">
    <path d="M140 298h60M420 312h90M760 300h50M1010 318h80M1300 304h60M1480 322h70"/>
    <path d="M260 326h40M600 330h70M900 296h36M1180 330h50" opacity="0.7"/>
  </g>
  <!-- Sun glint on the water -->
  <g stroke="#fbe9d0" stroke-linecap="round" stroke-width="3" opacity="0.8">
    <path d="M1100 292h60M1090 306h80M1110 320h40"/>
  </g>

  <!-- Sand -->
  <path d="M0 336c220-14 520-6 800 2s600 6 800-10v72H0z" fill="url(#sand)"/>
  <path d="M0 340c220-12 520-4 800 4s600 4 800-12" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- Blossom branch from the top-left corner -->
  <g>
    <path d="M-20 70C80 80 150 110 230 150c40 20 70 44 96 74" fill="none" stroke="#6b4a36" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 112c20-30 46-48 80-58M240 158c34-6 66 0 96 18M110 92c-6-26 0-48 18-66" fill="none" stroke="#6b4a36" stroke-width="6" stroke-linecap="round"/>
    <g fill="#f29a80">
      <circle cx="40" cy="40" r="46"/><circle cx="120" cy="30" r="40"/><circle cx="200" cy="44" r="34"/>
      <circle cx="250" cy="70" r="30"/><circle cx="90" cy="100" r="34"/><circle cx="170" cy="96" r="30"/>
      <circle cx="300" cy="150" r="26"/><circle cx="340" cy="186" r="22"/><circle cx="20" cy="110" r="30"/>
    </g>
    <g fill="#e8735a">
      <circle cx="70" cy="62" r="24"/><circle cx="150" cy="58" r="22"/><circle cx="228" cy="88" r="18"/>
      <circle cx="320" cy="170" r="14"/><circle cx="118" cy="124" r="16"/><circle cx="16" cy="76" r="20"/>
    </g>
    <g fill="#fbc7b6">
      <circle cx="104" cy="16" r="16"/><circle cx="184" cy="26" r="14"/><circle cx="268" cy="56" r="12"/>
      <circle cx="42" cy="18" r="18"/><circle cx="292" cy="134" r="10"/>
    </g>
  </g>

  <!-- Drifting petals -->
  <g fill="#f29a80">
    <ellipse cx="430" cy="160" rx="6" ry="3.5" transform="rotate(-30 430 160)"/>
    <ellipse cx="520" cy="236" rx="5" ry="3" transform="rotate(20 520 236)"/>
    <ellipse cx="400" cy="262" rx="5" ry="3" transform="rotate(-50 400 262)"/>
    <ellipse cx="690" cy="200" rx="4.5" ry="2.8" transform="rotate(35 690 200)"/>
  </g>
</svg>
